<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Story Writer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#fff;z-index:9999;flex-direction:column;gap:16px;padding:24px;">
    <div style="background:#fff;color:#000;padding:28px;border-radius:8px;max-width:520px;text-align:center;">
      <h2 style="margin-top:0">Please sign in to continue</h2>
      <p style="margin:8px 0 16px 0">You must sign in with your account to create or edit stories.</p>
      <div style="display:flex;gap:8px;justify-content:center">
        <button id="splashLoginBtn" style="padding:8px 14px;font-size:16px">Log in with Auth0</button>
        <button id="splashGuestBtn" style="padding:8px 14px;font-size:16px;display:none">Continue as guest</button>
      </div>
    </div>
  </div>
  <div id="app">
    <aside id="sidebar">
      <div id="storiesPane" class="pane">
        <div class="stories">
          <h3>Stories</h3>
          <div class="story-controls">
            <input id="newStoryName" placeholder="New story name" />
            <button id="createStoryBtn">Create</button>
          </div>
          <ul id="storyList"></ul>
        </div>
      </div>

      <div class="splitter" data-split="stories-tiles" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

      <div id="tilesPane" class="pane">
        <!-- Tiles: per-story small text chunks -->
        <div class="tiles" id="tilesSection" style="margin-top:12px;display:none">
          <h4 style="margin:6px 0 8px 0">Tiles</h4>
          <div class="tile-controls" style="display:flex;gap:8px;margin-bottom:8px">
            <input id="newTileTitle" placeholder="Tile title" />
            <button id="createTileBtn">Add Tile</button>
          </div>
          <ul id="tileList"></ul>
        </div>
      </div>

      <div class="entities">
      <div class="splitter" data-split="tiles-highlights" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

      <div id="highlightsPane" class="pane">
        <div class="entities">
          <h3>Highlights <select id="hlSort"><option value="alpha">A→Z</option><option value="count">By count</option></select></h3>

          <!-- Add highlight via input -->
          <div class="highlight-add" style="display:flex;gap:8px;margin-bottom:8px">
            <input id="newHighlightInput" placeholder="New highlight name" />
            <button id="createHighlightBtn">Add</button>
          </div>

          <ul id="highlightList"></ul>
        </div>
      </div>

      <div class="story-actions">
        <button id="closeStoryBtn">Close</button>
      </div>
    </aside>

    <main id="main">
      <header>
        <h1 id="currentStoryTitle" class="editable" tabindex="0">No story opened</h1>
        <div class="main-actions">
          <button id="saveBtn">Save</button>
          <button id="loginBtn" style="display:none">Log in</button>
          <button id="logoutBtn" style="display:none">Log out</button>
        </div>
      </header>

      <section id="editorArea">
        <textarea id="editor" placeholder="Write your story here..."></textarea>
        <div id="preview" class="preview"></div>
      </section>
    </main>
  </div>

  <!-- simple modal for editing an entity -->
  <div id="entityModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="entityModalTitle"></h2>
      <textarea id="entityContent" rows="10"></textarea>
      <div class="modal-controls">
        <input type="file" id="entityImageInput" />
        <button id="saveEntityBtn">Save</button>
        <button id="closeEntityBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- hidden file input reused for right-click uploads -->
  <input type="file" id="globalHiddenFileInput" style="display:none" />

  <script src="main.js"></script>
</body>
</html>
